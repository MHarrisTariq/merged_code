services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    # No host port mapping needed (services talk over the compose network).

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - GATEWAY_PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - SEO_SERVICE_URL=http://seo-service:5001
      - AI_SERVICE_URL=http://ai-content-service:5002
      - PRICING_SERVICE_URL=http://pricing-service:5003
      - PREDICTION_SERVICE_URL=http://prediction-service:5004
      - ANALYTICS_SERVICE_URL=http://analytics-service:5005
    depends_on:
      - redis
      - seo-service
      - ai-content-service
      - pricing-service
      - prediction-service
      - analytics-service

  seo-service:
    build:
      context: .
      dockerfile: services/seo-service/Dockerfile
    environment:
      - SEO_SERVICE_PORT=5001
      - MONGO_URI=mongodb://mongo:27017/swyft
      - REDIS_HOST=redis
      - AI_SERVICE_URL=http://ai-content-service:5002
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    depends_on:
      - mongo
      - redis

  ai-content-service:
    build:
      context: .
      dockerfile: services/ai-content-service/Dockerfile
    environment:
      - AI_SERVICE_PORT=5002
      - REDIS_HOST=redis
      - OPENAI_KEY=${OPENAI_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    depends_on:
      - redis

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile
    environment:
      - PRICING_SERVICE_PORT=5003
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://mongo:27017/swyft
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    depends_on:
      - redis
      - mongo

  prediction-service:
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    environment:
      - PREDICTION_SERVICE_PORT=5004
      - PRICING_SERVICE_URL=http://pricing-service:5003
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    depends_on:
      - pricing-service

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      - ANALYTICS_SERVICE_PORT=5005
      - MONGO_URI=mongodb://mongo:27017/swyft
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    # Host port intentionally not published (port conflicts on dev machines).
    # If you want to expose it, add: ports: ["3000:3000"]
    environment:
      - API_URL=http://api-gateway:5000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - api-gateway

volumes:
  mongo_data:

