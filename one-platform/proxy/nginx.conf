events {}

http {
  server {
    listen 80;

    # Portal
    location / {
      proxy_pass http://portal:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Booking (UI + API)
    location /booking/ {
      proxy_pass http://booking-frontend/;
      proxy_set_header Host $host;
    }

    location /booking-api/ {
      proxy_pass http://booking-backend:3000/;
      proxy_set_header Host $host;
    }

    # Car pricing (UI + API)
    location /car/ {
      proxy_pass http://car-frontend/;
      proxy_set_header Host $host;
    }

    location /car-api/ {
      proxy_pass http://car-api:8000/;
      proxy_set_header Host $host;
    }

    # Airbnb smart pricing (UI + API)
    location /airbnb/ {
      proxy_pass http://airbnb-frontend/;
      proxy_set_header Host $host;
    }

    location /airbnb-api/ {
      proxy_pass http://airbnb-backend:8000/;
      proxy_set_header Host $host;
    }

    # SEO Optimization (UI + API gateway)
    location /seo/ {
      proxy_pass http://seo-frontend:3000/;
      proxy_set_header Host $host;
    }

    location /seo-api/ {
      proxy_pass http://seo-api-gateway:5000/;
      proxy_set_header Host $host;
    }

    # Subscription Plan / Ranking Intelligence API
    location /subplan-api/ {
      proxy_pass http://rank-api:8080/;
      proxy_set_header Host $host;
    }
  }
}

