# Sample only — adjust namespace, image, resources, probes, and secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-rental-pricing-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-rental-pricing-api
  template:
    metadata:
      labels:
        app: car-rental-pricing-api
    spec:
      containers:
        - name: api
          image: car-rental-pricing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: FALLBACK_PRICE_GBP
              value: "99.0"
            # - name: REDIS_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: pricing-secrets
            #       key: redis-url
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: car-rental-pricing-api
spec:
  selector:
    app: car-rental-pricing-api
  ports:
    - port: 80
      targetPort: 8000
