# Swyft Pricing Platform — local stack.
# Kafka: single Confluent broker (RF=1) for dev. Production: MSK with 3+ brokers (see infra/terraform/msk.tf).
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29094,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swyft
      POSTGRES_PASSWORD: swyft
      POSTGRES_DB: swyft
    ports:
      - "5432:5432"
    volumes:
      - ./infra/db/postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swyft -d swyft"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ..
      dockerfile: swyft-pricing-platform/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /app/models/car
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka-1:
        condition: service_started

  pricing-engine:
    build:
      context: ..
      dockerfile: swyft-pricing-platform/services/pricing-engine/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      MODEL_DIR: /app/models/car
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  demand-service:
    build:
      context: ..
      dockerfile: swyft-pricing-platform/services/demand-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      DEMAND_PUBLISH_INTERVAL_SEC: "60"
    depends_on:
      - kafka-1

  supply-service:
    build:
      context: ..
      dockerfile: swyft-pricing-platform/services/supply-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
    depends_on:
      - kafka-1

  recommendation-service:
    build:
      context: ..
      dockerfile: swyft-pricing-platform/services/recommendation-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
    depends_on:
      - kafka-1
      - demand-service

  feature-store:
    build:
      context: ..
      dockerfile: swyft-pricing-platform/services/feature-store/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  admin-service:
    build:
      context: ..
      dockerfile: swyft-pricing-platform/services/admin-service/Dockerfile

  booking-feedback:
    build:
      context: ..
      dockerfile: swyft-pricing-platform/services/booking-feedback/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      DATABASE_URL_SYNC: postgresql+psycopg2://swyft:swyft@postgres:5432/swyft
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_started

  price-publisher:
    build:
      context: ..
      dockerfile: swyft-pricing-platform/services/price-publisher/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      DATABASE_URL_SYNC: postgresql+psycopg2://swyft:swyft@postgres:5432/swyft
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka-1:
        condition: service_started
